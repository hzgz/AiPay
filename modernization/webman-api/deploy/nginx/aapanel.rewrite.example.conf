    proxy_set_header Connection "";
}

location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
}
