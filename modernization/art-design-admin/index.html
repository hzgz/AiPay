<!doctype html>
<html>
  <head>
    <title>AiPay</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AiPay 可商用聚合支付与商户接入平台，提供首页介绍、支付说明与商户接入入口。"
    />
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/images/favicon.ico" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const hash = String(window.location.hash || '')
          const routePath = hash.startsWith('#/') ? hash.slice(1).split('?')[0] : window.location.pathname
          const isMerchantRoute =
            routePath === '/merchant' || routePath.startsWith('/merchant/')
          const merchantToken =
            localStorage.getItem('aipay_merchant_front_token') ||
            String(document.cookie || '')
              .split(';')
              .map((item) => item.trim())
              .find((item) => item.startsWith('front_token='))?.slice('front_token='.length) ||
            ''
          const scope = isMerchantRoute
            ? merchantToken
              ? `merchant:${decodeURIComponent(merchantToken)}`
              : 'merchant:guest'
            : 'admin'
          const scopedThemeKey = `sys-theme:${scope}`
          const themeType =
            localStorage.getItem(scopedThemeKey) ||
            (scope === 'admin' ? localStorage.getItem('sys-theme') : null)
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
